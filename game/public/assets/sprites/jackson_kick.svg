<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 96" shape-rendering="crispEdges">
  <!-- Jackson Kick Pose -->
  <!-- Hair -->
  <rect x="20" y="4" width="24" height="6" fill="#1c1917" />
  <rect x="18" y="8" width="28" height="6" fill="#1c1917" />
  <rect x="16" y="12" width="32" height="6" fill="#1c1917" />
  <rect x="20" y="18" width="24" height="6" fill="#1c1917" />
  
  <!-- Head & Face -->
  <rect x="20" y="20" width="24" height="18" fill="#fde68a" />
  <!-- Glasses -->
  <rect x="22" y="26" width="8" height="8" fill="none" stroke="#000000" stroke-width="2" />
  <rect x="34" y="26" width="8" height="8" fill="none" stroke="#000000" stroke-width="2" />
  <rect x="30" y="28" width="4" height="2" fill="#000000" />

  <!-- Torso leaning -->
  <rect x="16" y="38" width="28" height="22" fill="#2563eb" />
  <!-- Arms spread -->
  <rect x="4" y="38" width="12" height="6" fill="#2563eb" />
  <rect x="0" y="38" width="4" height="6" fill="#fde68a" />

  <!-- Standing Leg -->
  <rect x="18" y="60" width="10" height="24" fill="#0f172a" />
  <rect x="16" y="84" width="12" height="8" fill="#f8fafc" />

  <!-- Kicking Extended Leg -->
  <rect x="44" y="48" width="26" height="12" fill="#0f172a" />
  <!-- Kicking Foot -->
  <rect x="70" y="44" width="10" height="16" fill="#f8fafc" />
  
  <!-- Impact FX Burst -->
  <circle cx="75" cy="52" r="12" fill="#fef08a" opacity="0.8" />
</svg>
