<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" shape-rendering="crispEdges">
  <!-- Jackson Victory Pose Sprite -->
  <!-- Sparkles around -->
  <rect x="4" y="8" width="4" height="4" fill="#fef08a" />
  <rect x="56" y="12" width="4" height="4" fill="#fef08a" />
  <rect x="8" y="32" width="3" height="3" fill="#38bdf8" />
  <rect x="52" y="36" width="3" height="3" fill="#fef08a" />

  <!-- Hair -->
  <rect x="20" y="4" width="24" height="6" fill="#1c1917" />
  <rect x="18" y="8" width="28" height="6" fill="#1c1917" />
  
  <!-- Head & Cheerful Smile -->
  <rect x="20" y="18" width="24" height="18" fill="#fde68a" />
  <rect x="22" y="24" width="8" height="8" fill="none" stroke="#000000" stroke-width="2" />
  <rect x="34" y="24" width="8" height="8" fill="none" stroke="#000000" stroke-width="2" />
  <rect x="30" y="26" width="4" height="2" fill="#000000" />
  <rect x="26" y="30" width="12" height="4" fill="#e11d48" />

  <!-- Blue Shirt -->
  <rect x="16" y="36" width="32" height="24" fill="#2563eb" />
  <!-- Both arms raised celebrating V for victory -->
  <rect x="6" y="20" width="8" height="20" fill="#2563eb" />
  <rect x="50" y="20" width="8" height="20" fill="#2563eb" />
  <circle cx="10" cy="16" r="4" fill="#fde68a" />
  <circle cx="54" cy="16" r="4" fill="#fde68a" />

  <!-- Black Pants -->
  <rect x="18" y="60" width="28" height="24" fill="#0f172a" />
  <!-- White Sneakers -->
  <rect x="14" y="84" width="14" height="8" fill="#f8fafc" />
  <rect x="36" y="84" width="14" height="8" fill="#f8fafc" />
</svg>
