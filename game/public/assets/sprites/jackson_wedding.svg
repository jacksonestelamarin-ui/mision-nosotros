<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" shape-rendering="crispEdges">
  <!-- Jackson Wedding Sprite (Full All-White Suit) -->
  <!-- Hair: Dark semi-wavy hair with low taper fade -->
  <rect x="20" y="4" width="24" height="6" fill="#1c1917" />
  <rect x="18" y="8" width="28" height="6" fill="#1c1917" />
  <rect x="16" y="12" width="32" height="6" fill="#1c1917" />
  <rect x="20" y="18" width="24" height="6" fill="#1c1917" />
  <rect x="16" y="18" width="4" height="8" fill="#57534e" />
  <rect x="44" y="18" width="4" height="8" fill="#57534e" />
  
  <!-- Face & Head -->
  <rect x="20" y="20" width="24" height="18" fill="#fde68a" />
  <!-- Glasses -->
  <rect x="22" y="26" width="8" height="8" fill="none" stroke="#000000" stroke-width="2" />
  <rect x="34" y="26" width="8" height="8" fill="none" stroke="#000000" stroke-width="2" />
  <rect x="30" y="28" width="4" height="2" fill="#000000" />
  <rect x="24" y="27" width="2" height="2" fill="#38bdf8" />
  <rect x="36" y="27" width="2" height="2" fill="#38bdf8" />
  <rect x="28" y="34" width="8" height="2" fill="#e11d48" />

  <!-- ALL-WHITE SUIT JACKET & VEST (#ffffff / #f8fafc) -->
  <rect x="16" y="38" width="32" height="24" fill="#ffffff" />
  <rect x="16" y="38" width="32" height="24" stroke="#e2e8f0" stroke-width="1" />
  <rect x="30" y="38" width="4" height="24" fill="#f1f5f9" /> <!-- Lapel line -->
  <rect x="22" y="44" width="4" height="4" fill="#ef4444" rx="1" /> <!-- Red Boutonniere Flower -->

  <!-- ALL-WHITE SUIT ARMS -->
  <rect x="10" y="38" width="6" height="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5" />
  <rect x="48" y="38" width="6" height="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5" />
  <rect x="10" y="58" width="6" height="6" fill="#fde68a" />
  <rect x="48" y="58" width="6" height="6" fill="#fde68a" />

  <!-- ALL-WHITE SUIT TROUSERS (#ffffff) -->
  <rect x="18" y="62" width="28" height="22" fill="#ffffff" />
  <rect x="18" y="62" width="28" height="22" stroke="#e2e8f0" stroke-width="1" />
  <rect x="31" y="66" width="2" height="18" fill="#cbd5e1" />

  <!-- WHITE WEDDING DRESS SHOES / SNEAKERS (#ffffff) -->
  <rect x="14" y="84" width="14" height="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <rect x="36" y="84" width="14" height="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <rect x="12" y="88" width="16" height="4" fill="#f8fafc" />
  <rect x="36" y="88" width="16" height="4" fill="#f8fafc" />
</svg>
