<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" shape-rendering="crispEdges">
  <!-- Jackson Jump Sprite -->
  <!-- Hair -->
  <rect x="20" y="2" width="24" height="6" fill="#1c1917" />
  <rect x="18" y="6" width="28" height="6" fill="#1c1917" />
  
  <!-- Head & Glasses -->
  <rect x="20" y="16" width="24" height="18" fill="#fde68a" />
  <rect x="22" y="22" width="8" height="8" fill="none" stroke="#000000" stroke-width="2" />
  <rect x="34" y="22" width="8" height="8" fill="none" stroke="#000000" stroke-width="2" />
  <rect x="30" y="24" width="4" height="2" fill="#000000" />
  <rect x="28" y="28" width="8" height="4" fill="#e11d48" /> <!-- Happy Jump Mouth -->

  <!-- Blue Shirt -->
  <rect x="16" y="34" width="32" height="24" fill="#2563eb" />
  <!-- Arms raised up in air -->
  <rect x="6" y="20" width="8" height="18" fill="#2563eb" />
  <rect x="50" y="20" width="8" height="18" fill="#2563eb" />
  <rect x="6" y="14" width="8" height="6" fill="#fde68a" />
  <rect x="50" y="14" width="8" height="6" fill="#fde68a" />

  <!-- Legs tucked / jumping -->
  <rect x="14" y="58" width="14" height="18" fill="#0f172a" />
  <rect x="36" y="58" width="14" height="18" fill="#0f172a" />
  <rect x="12" y="76" width="14" height="10" fill="#f8fafc" />
  <rect x="38" y="76" width="14" height="10" fill="#f8fafc" />
</svg>
