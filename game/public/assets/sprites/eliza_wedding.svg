<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" shape-rendering="crispEdges">
  <!-- Eliza Wedding (White Dress + Veil + Bouquet) -->
  <!-- Bridal Veil (Flowing semi-transparent white backdrop) -->
  <path d="M 12 10 L 52 10 L 60 76 L 4 76 Z" fill="#ffffff" opacity="0.6" />
  <rect x="18" y="6" width="28" height="4" fill="#f8fafc" />

  <!-- Blonde Hair -->
  <rect x="18" y="8" width="28" height="8" fill="#fde047" />
  <rect x="14" y="14" width="36" height="10" fill="#fde047" />
  <rect x="12" y="22" width="10" height="24" fill="#fde047" />
  <rect x="42" y="22" width="10" height="24" fill="#fde047" />

  <!-- Face & Blue Eyes -->
  <rect x="20" y="20" width="24" height="18" fill="#fef3c7" />
  <rect x="24" y="26" width="6" height="6" fill="#1d4ed8" />
  <rect x="34" y="26" width="6" height="6" fill="#1d4ed8" />
  <rect x="26" y="27" width="2" height="2" fill="#ffffff" />
  <rect x="36" y="27" width="2" height="2" fill="#ffffff" />
  <rect x="28" y="34" width="8" height="2" fill="#e11d48" />

  <!-- ALL-WHITE WEDDING DRESS (#ffffff / #f8fafc) -->
  <path d="M 18 38 L 46 38 L 56 84 L 8 84 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <rect x="14" y="38" width="36" height="10" fill="#f8fafc" /> <!-- Off-shoulder lace -->

  <!-- Flower Bouquet (Pink/Red/Yellow roses held in hands) -->
  <circle cx="32" cy="54" r="7" fill="#ef4444" />
  <circle cx="28" cy="52" r="4" fill="#f43f5e" />
  <circle cx="36" cy="52" r="4" fill="#fde047" />
  <circle cx="32" cy="58" r="4" fill="#38bdf8" />
  <rect x="30" y="60" width="4" height="8" fill="#10b981" /> <!-- Ribbon stem -->

  <!-- White Bridal Heels -->
  <rect x="20" y="84" width="10" height="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <rect x="34" y="84" width="10" height="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
</svg>
