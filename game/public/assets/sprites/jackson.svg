<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" shape-rendering="crispEdges">
  <!-- Jackson Pixel Art Sprite -->
  <!-- Hair: Dark semi-wavy hair with low taper fade -->
  <rect x="20" y="4" width="24" height="6" fill="#1c1917" />
  <rect x="18" y="8" width="28" height="6" fill="#1c1917" />
  <rect x="16" y="12" width="32" height="6" fill="#1c1917" />
  <rect x="20" y="18" width="24" height="6" fill="#1c1917" />
  <!-- Low Taper Fade Sideburns -->
  <rect x="16" y="18" width="4" height="8" fill="#57534e" />
  <rect x="44" y="18" width="4" height="8" fill="#57534e" />
  
  <!-- Head & Face (Skin #fcd34d) -->
  <rect x="20" y="20" width="24" height="18" fill="#fde68a" />
  <!-- Eyes -->
  <rect x="24" y="28" width="4" height="4" fill="#1e293b" />
  <rect x="36" y="28" width="4" height="4" fill="#1e293b" />
  <!-- Glasses (Classic Black Frame) -->
  <rect x="22" y="26" width="8" height="8" fill="none" stroke="#000000" stroke-width="2" />
  <rect x="34" y="26" width="8" height="8" fill="none" stroke="#000000" stroke-width="2" />
  <rect x="30" y="28" width="4" height="2" fill="#000000" />
  <rect x="18" y="28" width="4" height="2" fill="#000000" />
  <rect x="42" y="28" width="4" height="2" fill="#000000" />
  <!-- Lens reflection -->
  <rect x="24" y="27" width="2" height="2" fill="#38bdf8" />
  <rect x="36" y="27" width="2" height="2" fill="#38bdf8" />
  <!-- Smile -->
  <rect x="28" y="34" width="8" height="2" fill="#e11d48" />

  <!-- Blue T-Shirt (#2563eb) -->
  <rect x="16" y="38" width="32" height="24" fill="#2563eb" />
  <rect x="20" y="38" width="24" height="4" fill="#3b82f6" /> <!-- Highlight -->
  <rect x="16" y="58" width="32" height="4" fill="#1d4ed8" /> <!-- Shadow -->
  <!-- Arms & Hands -->
  <rect x="10" y="38" width="6" height="18" fill="#2563eb" />
  <rect x="48" y="38" width="6" height="18" fill="#2563eb" />
  <rect x="10" y="56" width="6" height="6" fill="#fde68a" />
  <rect x="48" y="56" width="6" height="6" fill="#fde68a" />

  <!-- Dark Black Pants (#0f172a) -->
  <rect x="18" y="62" width="28" height="22" fill="#0f172a" />
  <rect x="30" y="66" width="4" height="18" fill="#020617" /> <!-- Divider -->

  <!-- White Sneakers (#f8fafc) -->
  <rect x="14" y="84" width="14" height="8" fill="#f8fafc" />
  <rect x="36" y="84" width="14" height="8" fill="#f8fafc" />
  <rect x="12" y="88" width="16" height="4" fill="#cbd5e1" />
  <rect x="36" y="88" width="16" height="4" fill="#cbd5e1" />
</svg>
