<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" shape-rendering="crispEdges">
  <!-- Eliza Pixel Art Sprite -->
  <!-- Blonde Hair (#fde047 / #eab308) -->
  <rect x="18" y="4" width="28" height="8" fill="#fde047" />
  <rect x="14" y="10" width="36" height="10" fill="#fde047" />
  <rect x="12" y="18" width="12" height="28" fill="#fde047" /> <!-- Left curls down to shoulders -->
  <rect x="40" y="18" width="12" height="28" fill="#fde047" /> <!-- Right curls down to shoulders -->
  <rect x="20" y="4" width="24" height="4" fill="#eab308" />

  <!-- Face & Head -->
  <rect x="20" y="18" width="24" height="18" fill="#fef3c7" />
  <!-- Big Blue Eyes -->
  <rect x="24" y="24" width="6" height="6" fill="#1d4ed8" />
  <rect x="34" y="24" width="6" height="6" fill="#1d4ed8" />
  <rect x="26" y="25" width="2" height="2" fill="#ffffff" />
  <rect x="36" y="25" width="2" height="2" fill="#ffffff" />
  <!-- Cute Smile & Blush -->
  <rect x="22" y="30" width="3" height="2" fill="#f43f5e" opacity="0.6" />
  <rect x="39" y="30" width="3" height="2" fill="#f43f5e" opacity="0.6" />
  <rect x="29" y="32" width="6" height="2" fill="#e11d48" />

  <!-- Modest Light Blue Floral Dress (#3b82f6 / #60a5fa) -->
  <rect x="18" y="36" width="28" height="48" fill="#3b82f6" />
  <rect x="14" y="36" width="36" height="12" fill="#60a5fa" /> <!-- Puffed sleeves -->
  <!-- Lace Collar -->
  <rect x="24" y="36" width="16" height="4" fill="#f8fafc" />
  <!-- Floral Patterns -->
  <circle cx="24" cy="52" r="2" fill="#ffffff" />
  <circle cx="38" cy="56" r="2" fill="#ffffff" />
  <circle cx="28" cy="68" r="2" fill="#ffffff" />
  <circle cx="34" cy="76" r="2" fill="#ffffff" />

  <!-- Cute Silver Shoes -->
  <rect x="20" y="84" width="10" height="8" fill="#94a3b8" />
  <rect x="34" y="84" width="10" height="8" fill="#94a3b8" />
  <rect x="18" y="88" width="12" height="4" fill="#e2e8f0" />
  <rect x="34" y="88" width="12" height="4" fill="#e2e8f0" />
</svg>
